<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI小程序审核合规助手（变现原型）</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f3f7ff;
      color: #111827;
      padding: 20px;
    }
    .app { max-width: 920px; margin: 0 auto; }
    .card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 6px 18px rgba(0,0,0,.06); margin-bottom: 14px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .sub { color: #6b7280; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
    label { display: block; font-size: 13px; color: #374151; margin-bottom: 4px; }
    input, select, button { width: 100%; border: 1px solid #d1d5db; border-radius: 10px; padding: 10px; font-size: 14px; }
    button { border: none; background: #2563eb; color: #fff; cursor: pointer; }
    button:hover { filter: brightness(1.05); }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #111827; color: #f9fafb; padding: 12px; border-radius: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>AI小程序审核合规助手</h1>
      <div class="sub">定位：服务要上架微信小程序的团队，提前识别高风险文案/资质缺口/类目冲突，用“审核提效SaaS + 人工代审包”变现。</div>
    </section>

    <section class="card grid">
      <div>
        <label>客户类型</label>
        <select id="clientType">
          <option>个人开发者</option>
          <option>小型创业团队</option>
          <option>代运营公司</option>
          <option>企业数字化部门</option>
        </select>
      </div>
      <div>
        <label>计划上线功能点数量</label>
        <input id="featureCount" type="number" min="3" step="1" value="12" />
      </div>
      <div>
        <label>待审核页面数量</label>
        <input id="pageCount" type="number" min="2" step="1" value="18" />
      </div>
      <div>
        <label>目标动作</label>
        <select id="goal">
          <option>开通审核订阅</option>
          <option>购买一次代审服务</option>
          <option>解锁资质清单模板</option>
          <option>预约企业版接入</option>
        </select>
      </div>
    </section>

    <section class="card row">
      <div>
        <label>本轮MVP与变现输出</label>
        <div id="result" class="mono">点击“生成方案”开始。</div>
      </div>
      <button id="genBtn">生成方案</button>
    </section>
  </main>

  <script>
    const id = (k) => document.getElementById(k);

    id('genBtn').addEventListener('click', () => {
      const clientType = id('clientType').value;
      const featureCount = Math.max(3, Number(id('featureCount').value || 3));
      const pageCount = Math.max(2, Number(id('pageCount').value || 2));
      const goal = id('goal').value;

      const riskyPages = Math.max(1, Math.round(pageCount * 0.35));
      const docsNeed = Math.max(1, Math.round(featureCount * 0.4));
      const reviewHoursSaved = Math.max(6, Math.round(pageCount * 1.2));

      const output = `【机会点】\n小程序审核失败常见在“文案敏感词、类目资质不匹配、功能描述与提交材料不一致”。做一层预审工具，能直接降低反复提审成本，付费意愿强。\n\n【7天可做MVP】\nD1：搭建${clientType}版审核问卷（主体/类目/功能）\nD2：上线风险词扫描器（页面文案 + 提示语）\nD3：建立“功能-资质-类目”映射规则库\nD4：生成一键整改清单（按优先级排序）\nD5：输出提审材料包模板（截图/说明文档）\nD6：接入支付（订阅版 + 单次代审）\nD7：上线“首次过审率看板”和邀请裂变\n\n【关键测算（示例）】\n- 待审页面：${pageCount} 页\n- 高风险页面：${riskyPages} 页\n- 预估需补充资质项：${docsNeed} 项\n- 预计节省沟通与返工：${reviewHoursSaved} 小时/次\n\n【预计变现路径】\n1) 免费层：每周1次基础风险扫描（10页内）\n2) 订阅层：¥39/月（不限扫描 + 整改报告）\n3) 单次层：¥99/次人工代审包（含提审文档）\n4) 企业层：¥1999/年（多项目协作 + 审核数据沉淀）\n\n【拉新闭环】\n用户分享“过审报告”给合作开发者，双方各得1次高级扫描额度。\n\n【本轮北极星指标】\n- 首次过审率提升 > 20%\n- 单次提审周期缩短 > 30%\n- 免费转付费率 > 8%\n\n【本轮目标动作】\n${goal}`;

      id('result').textContent = output;
    });
  </script>
</body>
</html>
