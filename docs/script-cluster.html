<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>剧本聚类助手</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #0b1220; color: #e5e7eb; }
    .wrap { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    .side { border-right: 1px solid #1f2937; padding: 16px; background: #111827; overflow: auto; }
    .main { padding: 18px; overflow: auto; }
    h1, h2, h3 { margin: 0 0 12px; }
    .muted { color: #9ca3af; font-size: 13px; }
    .card { border: 1px solid #1f2937; background: #0f172a; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    input, textarea, button { width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid #374151; background: #111827; color: #e5e7eb; padding: 10px; }
    textarea { min-height: 120px; resize: vertical; }
    button { cursor: pointer; border: 0; background: #2563eb; font-weight: 600; }
    .ghost { background: #374151; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .script-item { padding: 10px; border-radius: 8px; border: 1px solid #1f2937; margin-bottom: 8px; cursor: pointer; }
    .script-item.active { border-color: #2563eb; background: #1e293b; }
    .reply { white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

    @media (max-width: 860px) {
      .wrap { grid-template-columns: 1fr; min-height: auto; }
      .side { border-right: 0; border-bottom: 1px solid #1f2937; }
      .main { padding: 14px; }
      .row { grid-template-columns: 1fr; }
      input, textarea, button { font-size: 16px; }
      .card { padding: 10px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="side">
      <h2>剧本聚类</h2>
      <p class="muted">按剧本分组管理请求与回复</p>
      <div id="scriptList"></div>
    </aside>
    <main class="main">
      <h1>发送剧本到火山模型</h1>
      <p class="muted">支持默认系统提示词、上传剧本、保存回复到服务端文件。</p>

      <div class="card">
        <h3>默认系统提示词</h3>
        <textarea id="defaultSystemPrompt">你是专业编剧助手，请输出结构清晰、可执行的文本建议。</textarea>
        <div style="margin-top:10px;">
          <button class="ghost" id="saveDefaultPrompt">保存默认提示词</button>
        </div>
      </div>

      <div class="card">
        <h3>接口配置</h3>
        <input id="apiBase" placeholder="后端地址，例如：https://your-api.example.com" />
        <div style="margin-top:10px;">
          <input id="apiToken" type="password" placeholder="接口令牌（对应服务端 SCRIPT_CLUSTER_TOKEN）" />
        </div>
        <p class="muted">GitHub Pages 是静态站点，必须填写你部署的后端地址。建议同时启用接口令牌。</p>
      </div>

      <div class="card">
        <h3>新建/更新剧本请求</h3>
        <div class="row">
          <input id="scriptTitle" placeholder="剧本标题（如：雨夜追凶）" />
          <input id="scriptId" placeholder="剧本ID（可留空自动生成）" />
        </div>
        <div style="margin-top:10px;">
          <input id="scriptFile" type="file" accept=".txt,.md,.json" />
        </div>
        <div style="margin-top:10px;">
          <textarea id="scriptText" placeholder="粘贴剧本文本"></textarea>
        </div>
        <div style="margin-top:10px;">
          <textarea id="instruction" placeholder="补充要求（可选），如：输出分镜大纲+角色弧光"></textarea>
        </div>
        <div style="margin-top:10px;" class="row">
          <button id="sendBtn">发送并获取回复</button>
          <button class="ghost" id="clearBtn">清空输入</button>
        </div>
      </div>

      <div class="card">
        <h3>最近回复</h3>
        <p id="meta" class="muted">尚未发送</p>
        <div id="reply" class="reply"></div>
      </div>
    </main>
  </div>

  <script>
    var STORE_KEY = 'script_cluster_store_v1';
    var PROMPT_KEY = 'script_cluster_default_prompt_v1';
    var API_BASE_KEY = 'script_cluster_api_base_v1';
    var API_TOKEN_KEY = 'script_cluster_api_token_v1';
    var state = { scripts: [], activeId: '' };

    function slugify(value) {
      return (value || '').trim().toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5_-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '') || 'script';
    }

    function loadState() {
      try { state = JSON.parse(localStorage.getItem(STORE_KEY) || '{"scripts":[],"activeId":""}'); } catch (_) {}
      if (!state.scripts) state.scripts = [];
      document.getElementById('defaultSystemPrompt').value = localStorage.getItem(PROMPT_KEY) || document.getElementById('defaultSystemPrompt').value;
      document.getElementById('apiBase').value = localStorage.getItem(API_BASE_KEY) || '';
      document.getElementById('apiToken').value = localStorage.getItem(API_TOKEN_KEY) || '';
      renderScripts();
      renderActive();
    }

    function saveState() {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }

    function savePrompt() {
      localStorage.setItem(PROMPT_KEY, document.getElementById('defaultSystemPrompt').value.trim());
      alert('默认提示词已保存');
    }

    function upsertScript(item) {
      var i = state.scripts.findIndex(function (x) { return x.script_id === item.script_id; });
      if (i >= 0) state.scripts[i] = item;
      else state.scripts.unshift(item);
      state.activeId = item.script_id;
      saveState();
      renderScripts();
      renderActive();
    }

    function renderScripts() {
      var list = document.getElementById('scriptList');
      list.innerHTML = '';
      state.scripts.forEach(function (s) {
        var div = document.createElement('div');
        div.className = 'script-item' + (state.activeId === s.script_id ? ' active' : '');
        div.innerHTML = '<div><b>' + s.title + '</b></div><div class="muted mono">' + s.script_id + '</div><div class="muted">回复数：' + (s.replies || []).length + '</div>';
        div.onclick = function () { state.activeId = s.script_id; saveState(); renderScripts(); renderActive(); };
        list.appendChild(div);
      });
    }

    function renderActive() {
      var s = state.scripts.find(function (x) { return x.script_id === state.activeId; });
      if (!s || !s.replies || !s.replies.length) {
        document.getElementById('meta').textContent = '尚未发送';
        document.getElementById('reply').textContent = '';
        return;
      }
      var r = s.replies[s.replies.length - 1];
      document.getElementById('meta').textContent = '剧本：' + s.title + ' | 时间：' + r.time + ' | 文件：' + (r.saved_file || '-');
      document.getElementById('reply').textContent = r.reply;
    }

    async function sendScript() {
      var title = (document.getElementById('scriptTitle').value || '').trim() || '未命名剧本';
      var script_id = (document.getElementById('scriptId').value || '').trim() || slugify(title);
      var script_text = (document.getElementById('scriptText').value || '').trim();
      var instruction = (document.getElementById('instruction').value || '').trim();
      var system_prompt = (document.getElementById('defaultSystemPrompt').value || '').trim();
      var apiBase = (document.getElementById('apiBase').value || '').trim().replace(/\/$/, '');
      var apiToken = (document.getElementById('apiToken').value || '').trim();
      if (!script_text) return alert('请先输入剧本文本');
      if (!apiBase) return alert('请先填写后端地址（API Base）');
      localStorage.setItem(API_BASE_KEY, apiBase);
      localStorage.setItem(API_TOKEN_KEY, apiToken);

      var btn = document.getElementById('sendBtn');
      btn.disabled = true;
      btn.textContent = '发送中...';
      try {
        var headers = { 'Content-Type': 'application/json' };
        if (apiToken) headers['X-API-Token'] = apiToken;
        var resp = await fetch(apiBase + '/api/script-chat', {
          method: 'POST',
          headers: headers,
          body: JSON.stringify({ title: title, script_id: script_id, script_text: script_text, instruction: instruction, system_prompt: system_prompt })
        });
        var raw = await resp.text();
        var data = {};
        try { data = JSON.parse(raw || '{}'); } catch (_) {
          throw new Error('后端返回的不是JSON，请检查 API Base 是否正确，当前响应片段：' + (raw || '').slice(0, 80));
        }
        if (!resp.ok || !data.ok) {
          throw new Error((data && (data.detail || data.error)) || 'request failed');
        }
        var old = state.scripts.find(function (x) { return x.script_id === script_id; }) || { script_id: script_id, title: title, script_text: script_text, replies: [] };
        old.title = title;
        old.script_text = script_text;
        old.replies = old.replies || [];
        old.replies.push({ time: new Date().toLocaleString(), reply: data.reply || '', saved_file: data.saved_file || '' });
        upsertScript(old);
      } catch (e) {
        alert('发送失败：' + (e.message || e));
      } finally {
        btn.disabled = false;
        btn.textContent = '发送并获取回复';
      }
    }

    function clearInput() {
      document.getElementById('scriptTitle').value = '';
      document.getElementById('scriptId').value = '';
      document.getElementById('scriptText').value = '';
      document.getElementById('instruction').value = '';
      document.getElementById('scriptFile').value = '';
    }

    document.getElementById('saveDefaultPrompt').onclick = savePrompt;
    document.getElementById('sendBtn').onclick = sendScript;
    document.getElementById('clearBtn').onclick = clearInput;
    document.getElementById('scriptFile').addEventListener('change', function (e) {
      var file = (e.target.files || [])[0];
      if (!file) return;
      file.text().then(function (text) { document.getElementById('scriptText').value = text; });
      if (!document.getElementById('scriptTitle').value) {
        document.getElementById('scriptTitle').value = (file.name || '未命名剧本').replace(/\.[^.]+$/, '');
      }
    });

    loadState();
  </script>
</body>
</html>
